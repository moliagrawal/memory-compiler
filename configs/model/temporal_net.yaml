model:
  name: "temporal_retrieval_net"
  d_in: 512
  d_hidden: 256
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  max_seq_len: 128
  pos_encoding: "sinusoidal"
  fusion_type: "hadamard_cat" # MLP([h_t; q; h_t * q])
  cross_attention: false
  heads:
    relevance_dim: 1
    boundary_smoothing_sigma: 1.5
